<header><div><h2 id="notebook-dialog-title">Edit notebook</h2><p>Personal notes</p></div><button type="button" class="secondary outline dialog-close" data-close-notebook aria-label="Close dialog">×</button></header><form class="notebook-form" action="fragments/notebook-saved.html" hx-get="fragments/notebook-saved.html" hx-target="#notebook-area" hx-params="none"><div class="form-fields"><label for="notebook-name">Name</label><input id="notebook-name" required maxlength="120" value="Personal notes" autocomplete="off"><div class="notebook-location"><h3>Storage location</h3><dl class="info-list"><div><dt>Connection</dt><dd>Notes storage</dd></div><div><dt>Bucket</dt><dd><code>my-notes</code></dd></div><div><dt>Prefix</dt><dd><code>personal/</code></dd></div><div><dt>Encryption</dt><dd>Plain S3</dd></div></dl><p class="credential-hint">Location and encryption are fixed. Add a new notebook to use different settings.</p></div><section class="field-section" aria-labelledby="access-title"><h3 id="access-title">Access</h3><label><input id="notebook-read-only" type="checkbox" role="switch" aria-describedby="notebook-access-help"> Read-only notebook</label><small id="notebook-access-help">A read-only connection always takes precedence.</small></section><div id="notebook-form-feedback" aria-live="polite"></div><button type="button" class="text-button preview-failure" hx-get="fragments/notebook-error.html" hx-target="#notebook-form-feedback" hx-params="none">Preview a save error</button></div><div class="form-actions"><button type="button" class="secondary outline" data-close-notebook>Cancel</button><button type="submit">Save changes</button></div></form>
